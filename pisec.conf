# pisec environment. Sections:
#   [allow]     egress allowlist; everything else is dropped     apply: make gw-reload
#   [hosts]     names only your LAN resolves (name ip)            apply: make gw-reload
#   [packages]  Fedora packages baked into the agent image       apply: make pod-build
#   [mount]     host paths mounted read-only (host [container])  apply: next make pod-shell
# Model providers and keys live in agent/config/ (settings.json, models.json, providers.env).

[allow]
# Domains: HTTP/HTTPS (ports 80/443) through the gateway's proxy
#   example.com              exact host
#   .example.com             host and all subdomains
# IPs: any protocol/tool (bash, nmap, ssh, ...), routed directly
#   10.10.10.5               all ports
#   10.10.10.0/24            whole range
#   10.10.10.5 tcp/22        single port
#   10.10.10.5 udp/161-162   port range

# LLM provider (match agent/config/settings.json)
api.anthropic.com

# Package registries and code hosting, for installs at runtime
#.fedoraproject.org
#pypi.org
#files.pythonhosted.org
#registry.npmjs.org
#.github.com
#.githubusercontent.com

[hosts]
# e.g. llm.lab.internal 192.168.1.20

[packages]
# e.g. nmap sqlmap radare2 python3-pip (one or more per line)

[mount]
# Default container path: /usr/local/src/<basename of host path>
#   ~/targets/webapp
#   /data/pcaps   /usr/local/src/pcaps
