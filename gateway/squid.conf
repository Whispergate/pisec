http_port 3128
visible_hostname pisec-gw

# Default deny: only domains from pisec.conf [allow] (generated by entrypoint.sh).
# -n: match IP literals as-is instead of reverse-resolving them.
acl allowlist dstdomain -n "/etc/squid/allowlist-domains.txt"

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all

# Pure forwarder: no caching, no identifying headers.
cache deny all
via off
forwarded_for delete

logformat pisec %ts.%03tu PROXY %Ss %>Hs %rm %ru %<a
access_log stdio:/var/log/pisec/proxy.log pisec
cache_log /var/log/squid/cache.log
# Reload signals PID 1 directly; a PID file would only go stale across container restarts.
pid_filename none
shutdown_lifetime 1 seconds
